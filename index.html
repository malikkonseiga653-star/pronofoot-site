<style>
:root{
  --navy:#050c20; --navy2:#0a1738; --on:#f3f5fb; --onmut:#a3b2dc; --g:#e8b83a; --g2:#f8d977; --gink:#241a00;
  --bg:#070f26; --surface:#0c1a42; --surface2:#112456; --ink:#f3f5fb; --mut:#9aa8cc;
  --line:rgba(232,184,58,.30); --hair:rgba(255,255,255,.09);

  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#edf0f8; --surface:#ffffff; --surface2:#e2e7f4; --ink:#0b1738; --mut:#53618a;
    --line:rgba(150,105,0,.40); --hair:rgba(11,23,56,.12); --gold:#a87400; --ok:#0b8c4e; --bad:#c7303a;
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;padding-bottom:84px}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1}
h1{font-size:2rem}
h2{font-size:1.4rem;margin:24px 0 10px}
h3{font-size:1.15rem}
.mut{color:var(--mut)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* identité */
.brand{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.7rem;letter-spacing:.02em;color:var(--on);line-height:1}
.tag{font-family:var(--serif);font-style:italic;color:var(--g);font-size:.8rem;margin-top:3px}

/* en-tête */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--navy2),var(--navy));border-bottom:1px solid var(--g)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:58px;gap:10px}
.status{font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--g);color:var(--on);background:transparent;max-width:64%;text-align:right}
.status.vip,.status.admin{background:var(--g);color:var(--gink);font-weight:700}
.status.premium{border-color:var(--ok);color:var(--ok)}
.status.none{border-color:var(--bad);color:var(--bad)}

/* navigation basse (téléphone) */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);border-top:1px solid var(--g);padding-bottom:env(safe-area-inset-bottom)}
.bottom .in{max-width:700px;margin:0 auto;display:flex}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;color:var(--onmut);font-size:.7rem;border-top:3px solid transparent}
.bottom a i{font-style:normal;font-size:1.2rem;line-height:1}
.bottom a.on{color:var(--g);border-top-color:var(--g)}

/* menu latéral (grand écran) */
.side{display:none}
@media (min-width:960px){
  body{padding-left:238px;padding-bottom:0}
  .bottom{display:none}
  .mob{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:238px;background:linear-gradient(180deg,var(--navy2),var(--navy));border-right:1px solid var(--g);padding:20px 14px;z-index:30}
  .side .brand{font-size:1.9rem;padding:0 6px}
  .side .tag{padding:0 6px;margin-bottom:22px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a,.side .sl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:var(--onmut);font-size:.95rem;border:0;background:transparent;cursor:pointer;width:100%;text-align:left}
  .side nav a.on{background:var(--g);color:var(--gink);font-weight:700}
  .side nav a:hover:not(.on),.side .sl:hover{background:rgba(255,255,255,.06);color:var(--on)}
  .side .bt{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .side .out{border:1px solid var(--g);color:var(--g);justify-content:center;font-weight:600}
  .top .wrap{justify-content:flex-end}
}

/* boutons et formulaires */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,var(--g2),var(--g));color:var(--gink);width:100%}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);color:#04230f}
.btn.sm{width:auto;padding:8px 12px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
label{display:block;font-size:.85rem;color:var(--mut);margin:14px 0 5px}
input,select{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:12px 13px;outline-offset:0}
input::placeholder{color:var(--mut);opacity:.7}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.85rem;color:var(--mut)}
.check input{width:auto;margin-top:3px}
.link{background:none;border:0;color:var(--gold);cursor:pointer;font-weight:600;padding:6px 0;width:auto}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--g);color:var(--gink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mut);padding:7px 14px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--g);color:var(--gink);border-color:var(--g);font-weight:700}

/* connexion */
.authbg{min-height:100vh;background:radial-gradient(120% 70% at 80% 0%,rgba(232,184,58,.22),transparent 55%),radial-gradient(90% 60% at 0% 100%,rgba(70,110,255,.25),transparent 60%),linear-gradient(160deg,#0a1a4a,#050c20);color:var(--on)}
.auth{max-width:440px;margin:0 auto;padding:9vh 18px 40px}
.auth .brand{font-size:3.2rem}
.auth .tag{font-size:1.05rem;margin:8px 0 6px}
.auth p.lead{margin:6px 0 20px;color:var(--onmut)}
.auth label,.auth .mut,.auth .check{color:var(--onmut)}
.auth input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:var(--on)}
.auth .link{color:var(--g)}
.auth .btn.line{color:var(--on);border-color:rgba(255,255,255,.3)}
.notice{background:var(--surface2);border-left:4px solid var(--g);padding:12px 14px;border-radius:6px;margin:14px 0;font-size:.92rem;color:var(--ink)}
.auth .notice{background:rgba(255,255,255,.09);color:var(--on)}
.notice.bad{border-left-color:var(--bad)}

/* tableau de bord */
.hero{position:relative;overflow:hidden;margin-top:14px;border:1px solid var(--g);border-radius:14px;padding:24px 18px 22px;color:var(--on);
  background:radial-gradient(110% 90% at 88% 0%,rgba(232,184,58,.30),transparent 55%),radial-gradient(80% 80% at 8% 105%,rgba(70,110,255,.30),transparent 60%),linear-gradient(135deg,#0b1d52,#050c20);background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;background:conic-gradient(from 205deg at 88% -12%,rgba(255,255,255,.13),transparent 9%,rgba(255,255,255,.09) 16%,transparent 27%,rgba(255,255,255,.07) 36%,transparent 46%);pointer-events:none}
.hero .ball{position:absolute;right:-26px;bottom:-34px;width:190px;height:190px;color:var(--g);opacity:.17}
.hero .in{position:relative;max-width:560px}
.hero .brand{font-size:2.9rem}
.hero .tag{font-size:1.25rem;margin:8px 0 8px}
.hero p{color:var(--onmut);font-size:.95rem;margin-bottom:16px}
.hero .btn{width:auto;padding:11px 22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile i{font-style:normal;font-size:1.7rem;line-height:1}
.tile small{display:block;font-size:.74rem;color:var(--mut);line-height:1.2}
.tile b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.05;color:var(--gold)}
.tile b.ok{color:var(--ok)}
.dash{display:grid;gap:18px;margin-top:6px}
@media (min-width:980px){.dash{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}}
.sech{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sech h2{margin:0;display:flex;align-items:center;gap:8px}
.sech a{font-size:.82rem;color:var(--gold);border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px}
.box h3{padding:10px 0 6px;display:flex;align-items:center;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer;font-size:.9rem}
.rk .n{width:20px;text-align:center;font-family:var(--display);font-size:1.15rem;color:var(--gold)}
.rk .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk b{font-family:var(--display);font-size:1.15rem;color:var(--gold)}
.promo{margin-top:16px;border:1px solid var(--g);border-radius:12px;padding:16px;background:linear-gradient(135deg,#142a66,#07112e);color:var(--on)}
.promo h3{color:var(--g)}
.promo p{color:var(--onmut);font-size:.9rem;margin:6px 0 12px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
@media (min-width:720px){.feats{grid-template-columns:repeat(4,1fr)}}
.feat{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--mut);padding:10px 4px;border-top:1px solid var(--line)}
.feat i{font-style:normal;font-size:1.3rem}

/* cartes de match (tableau de bord) */
.mc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.mc-h{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--mut)}
.mc-b{display:flex;align-items:center;justify-content:space-around;gap:6px;padding:12px 0 10px}
.tm2{flex:1;text-align:center;min-width:0}
.tm2 img{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto 6px}
.tm2 b{font-family:var(--display);font-size:1.15rem;line-height:1.1;display:block;word-break:break-word}
.vs2{font-family:var(--display);font-size:1.6rem;font-style:italic;font-weight:700;color:var(--gold)}
.mc-p{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:rgba(232,184,58,.06)}
.mc-p .ph{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:4px}
.pl{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;padding:2px 0}
.pl span{color:var(--mut)}
.pl b{text-align:right;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b.lk{color:var(--gold)}
@media (min-width:620px){
  .mc{display:grid;grid-template-columns:1fr minmax(0,230px);grid-template-areas:"h h" "b p";column-gap:14px}
  .mc-h{grid-area:h}.mc-b{grid-area:b}.mc-p{grid-area:p}
}

/* liste des matchs */
.comp{display:flex;align-items:center;gap:8px;margin:20px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--g);font-weight:600}
.comp img{width:20px;height:20px;object-fit:contain}
.comp span{font-weight:400;color:var(--mut);font-size:.85rem}
.m{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.m .t{width:46px;text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1}
.m .t small{display:block;font-family:var(--body);font-size:.68rem;color:var(--mut);font-weight:400;margin-top:3px}
.m .tm{display:flex;align-items:center;gap:7px;min-width:0}
.m .tm img{width:18px;height:18px;object-fit:contain;flex:none}
.m .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .pk{text-align:right;flex:none;max-width:42%}
.m .pk b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--gold);line-height:1}
.m .pk span{font-size:.72rem;color:var(--mut)}

/* fiche d'analyse */
.pitch{background:radial-gradient(100% 120% at 50% 0%,rgba(232,184,58,.16),transparent 60%),linear-gradient(135deg,#0b1d52,#050c20);border:1px solid var(--g);color:var(--on);border-radius:14px;padding:18px 14px 16px;margin-top:14px;position:relative;overflow:hidden}
.pitch .cmp{text-align:center;font-size:.85rem;color:var(--onmut);position:relative}
.pitch .vs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;position:relative}
.side2{flex:1;text-align:center;min-width:0}
.side2 img{width:58px;height:58px;object-fit:contain}
.side2 div{font-family:var(--display);font-size:1.3rem;font-weight:700;margin-top:6px;line-height:1.1;word-break:break-word}
.score{font-family:var(--display);font-size:2.6rem;font-weight:700;min-width:84px;text-align:center;color:var(--g)}
.when{text-align:center;position:relative;margin-top:12px;font-weight:600}
.lock{display:inline-block;margin-top:8px;font-size:.78rem;background:rgba(255,255,255,.1);color:var(--onmut);padding:4px 10px;border-radius:999px;position:relative}
.gauge{--v:50;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--v)*1%),var(--hair) 0);display:grid;place-items:center;flex:none}
.gauge span{width:58px;height:58px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;font-weight:700}
.sum{display:flex;gap:14px;align-items:center;margin:16px 0 4px}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fm b{display:block;font-size:.85rem;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;margin-right:4px;font-size:.78rem;font-weight:700;color:#04230f}
.fm .V{background:var(--ok)}.fm .N{background:var(--mut);color:var(--bg)}.fm .D{background:var(--bad);color:#fff}
.warn{background:var(--surface2);border-left:4px solid var(--g);padding:10px 12px;border-radius:6px;margin-top:12px;font-size:.88rem}
.pred{padding:14px 0;border-bottom:1px solid var(--hair)}
.pred .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pred .h small{color:var(--mut)}
.pred .pick{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:4px 0 8px;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7af0b4);border-radius:99px}
.pred .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:.82rem;color:var(--mut)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:6px;vertical-align:middle}
.badge.vip{background:var(--g);color:var(--gink)}
.badge.win{background:var(--ok);color:#04230f}
.badge.loss{background:var(--bad);color:#fff}
.pred.locked .pick{color:var(--mut)}
.pred.locked .bar i{background:var(--g);width:100%;opacity:.25}
.legal{margin:26px 0 8px;font-size:.78rem;color:var(--mut)}

/* abonnement et profil */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.price{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;color:var(--gold)}
.price small{font-size:1rem;color:var(--mut);font-weight:500}
.list{margin:12px 0 4px;padding-left:0;list-style:none}
.list li{padding:5px 0 5px 26px;position:relative}
.list li:before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:700}
.list li.x{color:var(--mut)}.list li.x:before{content:"—";color:var(--mut)}
.step{display:flex;gap:12px;margin-top:18px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--gink);display:grid;place-items:center;font-weight:700}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-top:8px}
.pay b{font-family:var(--display);font-size:1.3rem;letter-spacing:.03em}
.code{font-family:var(--display);font-size:2.6rem;font-weight:700;letter-spacing:.14em;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px 8px;margin-top:12px;color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{text-align:right;word-break:break-all}

/* administration */
.table .r{padding:11px 0;border-bottom:1px solid var(--hair)}
.table .r .top2{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.table .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pillst{font-size:.74rem;padding:2px 8px;border-radius:99px;background:var(--surface2)}
.pillst.ok{background:var(--ok);color:#04230f}.pillst.bad{background:var(--bad);color:#fff}.pillst.sun{background:var(--g);color:var(--gink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1;color:var(--gold)}
.stat span{font-size:.8rem;color:var(--mut)}

/* divers */
.skel{height:64px;border-radius:10px;margin:12px 0;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.4rem;margin-bottom:6px}
.foot{margin-top:28px;padding:14px 0 6px;border-top:1px solid var(--line);font-size:.78rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--g);color:var(--gink);padding:11px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad);color:#fff}
#toast.ok{background:var(--ok);color:#04230f}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  else { const i = document.createElement("input"); i.value = text; document.body.appendChild(i); i.select(); try { document.execCommand("copy"); } catch (e) {} i.remove(); done(); }

function frErr(m) {
  m = String(m || ""); const l = m.toLowerCase();
  if (l.includes("invalid login")) return "E-mail ou mot de passe incorrect.";
  if (l.includes("not confirmed")) return "Confirme d’abord ton adresse e-mail : ouvre le message reçu dans ta boîte mail.";
  if (l.includes("already registered") || l.includes("already been registered")) return "Cette adresse e-mail a déjà un compte. Connecte-toi.";
  if (l.includes("at least") && l.includes("character")) return "Mot de passe trop court : 8 caractères minimum.";
  if (l.includes("rate limit") || l.includes("too many")) return "Trop de tentatives. Réessaie dans quelques minutes.";
  if (l.includes("failed to fetch") || l.includes("network") || l.includes("load failed")) return "Pas de connexion internet. Réessaie.";
  if (l.includes("jwt")) return "Session expirée. Reconnecte-toi.";
  return m || "Une erreur est survenue. Réessaie.";
}

/* ---------- accès réseau ---------- */
async function rawAuth(path, body, method, token) {
  const r = await fetch(SUPABASE_URL + path, {
    method: method || "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: JSON.stringify(body)
  });
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((d && (d.msg || d.error_description || d.message || d.error)) || ("Erreur " + r.status));
  return d;
}
function setSession(d) {
  S.session = {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    uid: d.user.id, email: d.user.email
  };
  store.set("pf_session", JSON.stringify(S.session));
}
function clearSession() { S.session = null; S.profile = null; store.del("pf_session"); }
async function refreshSession() {
  if (!S.session || !S.session.refresh_token) return false;
  try {
    const d = await rawAuth("/auth/v1/token?grant_type=refresh_token", { refresh_token: S.session.refresh_token });
    setSession(d); return true;
  } catch (e) { clearSession(); return false; }
}
async function api(path, opts) {
  opts = opts || {};
  const headers = {
    apikey: SUPABASE_KEY, "Content-Type": "application/json",
    ...(S.session ? { Authorization: "Bearer " + S.session.access_token } : {}),
    ...(opts.headers || {})
  };
  const res = await fetch(SUPABASE_URL + path, { method: opts.method || "GET", headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401 && !opts._retry && S.session) {
    if (await refreshSession()) return api(path, { ...opts, _retry: true });
    route(); throw new Error("Session expirée. Reconnecte-toi.");
  }
  const text = await res.text(); let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) throw new Error((data && (data.message || data.msg || data.hint)) || ("Erreur " + res.status));
  return data;
}
async function countRows(path) {
  try {
    const res = await fetch(SUPABASE_URL + path, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + S.session.access_token, Prefer: "count=exact", Range: "0-0" } });
    const n = (res.headers.get("content-range") || "").split("/")[1];
    return n && n !== "*" ? Number(n) : null;
  } catch (e) { return null; }
}

function accessInfo(p) {
  if (!p) return { ok: false, label: "Accès terminé", kind: "none" };
  const now = Date.now();
  if (p.role === "admin") return { ok: true, vip: true, label: "👑 Administrateur", kind: "admin" };
  if (p.plan === "trial") {
    if (!p.phone) return { ok: false, reason: "phone", label: "Profil à compléter", kind: "none" };
    const end = new Date(p.trial_started_at).getTime() + 7 * 864e5;
    if (now < end) { const d = Math.ceil((end - now) / 864e5); return { ok: true, vip: false, label: "Essai gratuit, " + d + (d > 1 ? " jours restants" : " jour restant"), kind: "trial" }; }
    return { ok: false, reason: "expired", label: "Essai terminé", kind: "none" };
  }
  if (p.plan_expires_at && new Date(p.plan_expires_at).getTime() > now) {
    const vip = p.plan === "vip";
    return { ok: true, vip, label: (vip ? "👑 VIP" : "Premium") + " jusqu’au " + fmtShort(p.plan_expires_at), kind: vip ? "vip" : "premium" };
  }
  return { ok: false, reason: "expired", label: "Abonnement expiré", kind: "none" };
}

/* ---------- libellés des pronostics ---------- */
function pickLabel(market, pick, h, a) {
  const [gh, ga] = [h || "Domicile", a || "Extérieur"];
  switch (market) {
    case "result_1x2": return pick === "1" ? "Victoire " + gh : pick === "2" ? "Victoire " + ga : "Match nul";
    case "double_chance": return pick === "1N" ? gh + " ou nul" : pick === "N2" ? "Nul ou " + ga : gh + " ou " + ga;
    case "over_under_25": return pick === "PLUS" ? "Plus de 2,5 buts" : "Moins de 2,5 buts";
    case "btts": return pick === "OUI" ? "Oui, les deux marquent" : "Non, une équipe ne marque pas";
    case "home_goals": return gh + (pick === "PLUS_1_5" ? " : plus de 1,5 but" : " : moins de 1,5 but");
    case "away_goals": return ga + (pick === "PLUS_1_5" ? " : plus de 1,5 but" : " : moins de 1,5 but");
    case "exact_score": return pick;
    case "ht_result": return pick === "1" ? gh + " mène à la mi-temps" : pick === "2" ? ga + " mène à la mi-temps" : "Nul à la mi-temps";
    case "ht_score": return pick;
    default: return pick;
  }
}
function shortPick(market, pick, h, a) {
  switch (market) {
    case "result_1x2": return pick === "1" ? (h || "Domicile") : pick === "2" ? (a || "Extérieur") : "Match nul";
    case "double_chance": return pick === "1N" ? "1X" : pick === "N2" ? "X2" : "12";
    case "over_under_25": return pick === "PLUS" ? "+ 2,5" : "- 2,5";
    case "exact_score": return String(pick).replace("-", " - ");
    default: return pickLabel(market, pick, h, a);
  }
}

  <input type="search" id="ms" placeholder="Rechercher une équipe ou un championnat" value="${esc(S.mSearch)}" oninput="S.mSearch=this.value;drawMatches()" style="margin-top:6px">

function setMF(f) { S.mFilter = f; route(); }
function drawMatches() {
  const box = $("#mlist"); if (!box) return;
  const now = new Date(), tom = new Date(Date.now() + 864e5), q = S.mSearch.trim().toLowerCase();
  const list = S.matches.filter((m) => {
    const d = new Date(m.kickoff_at);
    if (S.mFilter === "today" && !sameDay(d, now)) return false;
    if (S.mFilter === "tomorrow" && !sameDay(d, tom)) return false;
    if (q) { const s = [m.home && m.home.name, m.away && m.away.name, m.competition && m.competition.name, m.competition && m.competition.country].join(" ").toLowerCase(); if (!s.includes(q)) return false; }
    return true;
  });
  if (!list.length) { box.innerHTML = `<div class="empty"><b>Aucun match pour le moment</b>Les nouvelles analyses apparaissent ici dès qu’elles sont prêtes.</div>`; return; }
  const groups = new Map();
  list.forEach((m) => { const c = m.competition || { id: 0, name: "Autres", country: "" }; if (!groups.has(c.id)) groups.set(c.id, { c, items: [] }); groups.get(c.id).items.push(m); });
  const arr = [...groups.values()].sort((a, b) => new Date(a.items[0].kickoff_at) - new Date(b.items[0].kickoff_at) || (a.c.name || "").localeCompare(b.c.name || ""));
  box.innerHTML = arr.map((g) => `<div class="comp">${g.c.logo ? `<img src="${esc(g.c.logo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${esc(g.c.name)} <span>${esc(g.c.country || "")}</span></div>`
    + g.items.map((m) => {
      const p = predOf(m, "result_1x2");
      const hn = m.home && m.home.name, an = m.away && m.away.name;
      const day = sameDay(new Date(m.kickoff_at), now) ? "auj." : sameDay(new Date(m.kickoff_at), tom) ? "demain" : "";
      return `<div class="m" onclick="go('#/match/${Number(m.id)}')">
        <div class="t">${fmtTime(m.kickoff_at)}<small>${day}</small></div>
        <div class="grow"><div class="tm">${logo(m.home)}<span>${esc(hn)}</span></div>
        <div class="tm" style="margin-top:4px">${logo(m.away)}<span>${esc(an)}</span></div></div>
        ${p ? `<div class="pk"><b>${pct(p.probability)}</b><span>${esc(pickLabel(p.market, p.pick, hn, an))}</span></div>` : ""}</div>`;
    }).join("")).join("");
}

    view(token, `<h1 style="margin-top:18px">Administration</h1>${adminTabs()}${body}`);
    if (S.adminTab === "users") drawUsers("");
  } catch (e) { view(token, `<h1 style="margin-top:18px">Administration</h1>${adminTabs()}<div class="notice bad">${esc(frErr(e.message))}</div>`); }
}
async function adminCodes() {
  const rows = await api("/rest/v1/activation_codes?select=code,plan,duration_days,status,created_at,expires_at,used_at,note&order=id.desc&limit=30") || [];
  const st = (r) => r.status === "used" ? `<span class="pillst ok">Utilisé</span>` : new Date(r.expires_at) < new Date() ? `<span class="pillst bad">Expiré</span>` : `<span class="pillst sun">Valide</span>`;
  return `<div class="panel"><b>Générer un code d’activation</b>
  <form onsubmit="doGen(event)"><label>Formule</label><select name="plan"><option value="premium">Premium</option><option value="vip">VIP</option></select>
  <label>Durée</label><select name="days"><option value="30">1 mois (30 jours)</option><option value="365">1 an (365 jours)</option></select>
  <label>Pour qui (facultatif)</label><input name="note" placeholder="Nom ou numéro du client">
  <div style="height:14px"></div><button class="btn" type="submit">Générer le code</button></form><div id="newcode"></div></div>
  <h2>Derniers codes</h2><div class="table">${rows.length ? rows.map((r) => `<div class="r"><div class="top2"><b style="font-family:var(--display);font-size:1.2rem;letter-spacing:.1em">${esc(r.code)}</b>${st(r)}</div>
  <div class="small mut">${r.plan === "vip" ? "VIP" : "Premium"}, ${r.duration_days} jours, créé le ${esc(fmtShort(r.created_at))}${r.note ? ", " + esc(r.note) : ""}</div></div>`).join("") : `<div class="empty">Aucun code généré pour le moment.</div>`}</div>`;
}
async function doGen(ev) {
  ev.preventDefault(); const f = ev.target; busy(f, true);
  try {
    const code = await api("/rest/v1/rpc/admin_generate_code", { method: "POST", body: { p_plan: f.plan.value, p_duration_days: Number(f.days.value), p_note: f.note.value.trim() || null } });
    const label = (f.plan.value === "vip" ? "VIP" : "Premium") + (f.days.value === "365" ? " 1 an" : " 1 mois");
    const msg = "Voici ton code d’activation PRONOFOOT (" + label + ") : " + code + ". Valable 24 heures, à saisir dans Abonnement.";
    $("#newcode").innerHTML = `<div class="code">${esc(code)}</div><div class="row" style="margin-top:10px"><button class="btn sec sm grow" onclick="copy('${esc(code)}')">Copier le code</button><button class="btn sm grow" onclick="copy('${esc(msg)}')">Copier le message</button></div>`;
    toast("Code généré", "ok"); busy(f, false);
  } catch (e) { toast(frErr(e.message), "err"); busy(f, false); }
}
function userState(u) {
  const now = Date.now();
  if (u.role === "admin") return { t: "Admin", c: "sun" };
  if (u.plan === "trial") return now < new Date(u.trial_started_at).getTime() + 7 * 864e5 ? { t: "Essai", c: "" } : { t: "Essai fini", c: "bad" };
  return u.plan_expires_at && new Date(u.plan_expires_at) > now ? { t: u.plan === "vip" ? "VIP" : "Premium", c: "ok" } : { t: "Expiré", c: "bad" };
}
async function adminUsers() {
  S.users = await api("/rest/v1/profiles?select=id,email,full_name,phone,role,plan,plan_expires_at,trial_started_at,created_at&order=created_at.desc&limit=300") || [];
  const paid = S.users.filter((u) => ["Premium", "VIP"].includes(userState(u).t)).length;
  const trial = S.users.filter((u) => userState(u).t === "Essai").length;
  return `<div class="stats"><div class="stat"><b>${S.users.length}</b><span>comptes</span></div><div class="stat"><b>${paid}</b><span>abonnés actifs</span></div><div class="stat"><b>${trial}</b><span>essais en cours</span></div><div class="stat"><b>${S.users.length - paid - trial}</b><span>autres</span></div></div>
  <input type="search" id="usearch" placeholder="Rechercher par e-mail, nom ou téléphone" oninput="drawUsers(this.value)" style="margin-top:14px"><div class="table" id="ulist"></div>`;
}
function drawUsers(q) {
  const box = $("#ulist"); if (!box) return; q = (q || "").toLowerCase();
  const list = S.users.filter((u) => !q || [u.email, u.full_name, u.phone].join(" ").toLowerCase().includes(q)).slice(0, 80);
  box.innerHTML = list.map((u) => {
    const s = userState(u), open = S.openUser === u.id;
    return `<div class="r"><div class="top2" onclick="toggleUser('${esc(u.id)}')"><div class="grow"><b>${esc(u.full_name || "Sans nom")}</b><div class="small mut">${esc(u.email)}</div></div><span class="pillst ${s.c}">${s.t}</span></div>
    ${open ? `<div class="small mut" style="margin-top:6px">Téléphone : ${esc(u.phone || "non renseigné")}<br>Inscrit le ${esc(fmtShort(u.created_at))}${u.plan_expires_at && u.role !== "admin" ? "<br>Abonnement jusqu’au " + esc(fmtShort(u.plan_expires_at)) : ""}</div>
    <div class="acts"><button class="btn sm sec" onclick="setPlan('${esc(u.id)}','premium',30)">Premium 30 j</button><button class="btn sm sec" onclick="setPlan('${esc(u.id)}','premium',365)">Premium 1 an</button><button class="btn sm sec" onclick="setPlan('${esc(u.id)}','vip',30)">VIP 30 j</button><button class="btn sm sec" onclick="setPlan('${esc(u.id)}','vip',365)">VIP 1 an</button><button class="btn sm line" onclick="setPlan('${esc(u.id)}','trial',0)">Retirer l’abonnement</button></div>` : ""}</div>`;
  }).join("") || `<div class="empty">Aucun utilisateur trouvé.</div>`;
}
function toggleUser(id) { S.openUser = S.openUser === id ? null : id; const i = $("#usearch"); drawUsers(i ? i.value : ""); }
async function setPlan(id, plan, days) {
  if (!confirm(plan === "trial" ? "Retirer l’abonnement de ce compte ?" : "Donner cet abonnement à ce compte ?")) return;
  try {
    const r = await api("/rest/v1/rpc/admin_set_plan", { method: "POST", body: { p_user: id, p_plan: plan, p_days: days } });
    if (r && r.ok) { toast("Compte mis à jour", "ok"); route(); } else toast((r && r.message) || "Échec", "err");
  } catch (e) { toast(frErr(e.message), "err"); }
}
async function adminBot() {
  const [src, logs, an, pr, up, us] = await Promise.all([
    api("/rest/v1/data_sources?select=name,daily_quota,requests_today,quota_date,last_sync_at&limit=1"),
    api("/rest/v1/sync_logs?select=job,status,requests_used,message,started_at&order=id.desc&limit=8"),
    countRows("/rest/v1/analyses?select=id"), countRows("/rest/v1/predictions?select=id"),
    countRows("/rest/v1/matches?select=id&status=in.(NS,TBD)&kickoff_at=gte." + encodeURIComponent(new Date().toISOString()) + "&kickoff_at=lte." + encodeURIComponent(new Date(Date.now() + 48 * 36e5).toISOString())),
    countRows("/rest/v1/profiles?select=id")
  ]);
  const s = src && src[0];
  return `<div class="stats"><div class="stat"><b>${up ?? "?"}</b><span>matchs dans les 48 h</span></div><div class="stat"><b>${an ?? "?"}</b><span>analyses en base</span></div><div class="stat"><b>${pr ?? "?"}</b><span>pronostics en base</span></div><div class="stat"><b>${us ?? "?"}</b><span>comptes</span></div></div>
  ${s ? `<div class="panel"><b>${esc(s.name)}</b><p class="small mut" style="margin-top:4px">Requêtes utilisées aujourd’hui : ${s.requests_today} sur ${s.daily_quota}. Dernière synchronisation : ${s.last_sync_at ? esc(fmtShort(s.last_sync_at)) + " à " + fmtTime(s.last_sync_at) : "aucune"}.</p></div>` : ""}
  <h2>Dernières exécutions</h2><div class="table">${(logs || []).map((l) => `<div class="r"><div class="top2"><span>${esc(fmtShort(l.started_at))} à ${fmtTime(l.started_at)}</span><span class="pillst ${l.status === "ok" ? "ok" : "sun"}">${esc(l.status)}</span></div>
  <div class="small mut">${l.requests_used} requête(s)${l.message ? ", " + esc(l.message) : ""}</div></div>`).join("") || `<div class="empty">Aucune exécution enregistrée.</div>`}</div>`;
}
const SETTING_LABELS = [
  ["price_premium_month", "Prix Premium par mois (F CFA)"], ["price_premium_year", "Prix Premium par an (F CFA)"],
  ["price_vip_month", "Prix VIP par mois (F CFA)"], ["price_vip_year", "Prix VIP par an (F CFA)"],
  ["pay_orange", "Numéro Orange Money pour les dépôts"], ["pay_moov", "Numéro Moov Money pour les dépôts"],
  ["pay_holder", "Nom du titulaire des numéros"], ["whatsapp_admin", "WhatsApp de l’administrateur (avec l’indicatif, ex. 22670123456)"]
];
function adminSettings() {
  return `<form onsubmit="saveSettings(event)">${SETTING_LABELS.map(([k, l]) => `<label for="s_${k}">${esc(l)}</label><input id="s_${k}" name="${k}" value="${esc(S.settings[k] || "")}">`).join("")}
  <div style="height:16px"></div><button class="btn" type="submit">Enregistrer les réglages</button></form>
  <p class="small mut" style="margin-top:10px">Ces informations s’affichent dans la page Abonnement des clients.</p>`;
}
async function saveSettings(ev) {
  ev.preventDefault(); const f = ev.target; busy(f, true);
  try {
    const body = SETTING_LABELS.map(([k]) => ({ key: k, value: String(f[k].value || "").trim(), updated_at: new Date().toISOString() }));
    await api("/rest/v1/site_settings", { method: "POST", headers: { Prefer: "resolution=merge-duplicates" }, body });
    toast("Réglages enregistrés", "ok"); await loadSettings(); busy(f, false);
  } catch (e) { toast(frErr(e.message) + " (la table des réglages est-elle créée ?)", "err"); busy(f, false); }
}

/* ---------- routeur ---------- */
async function route() {
  const token = ++S.rt, app = $("#app");
  if (!configured()) { app.innerHTML = missingHTML(); return; }
  if (!S.session) { app.innerHTML = authHTML(); return; }
  if (S.recovery) { app.innerHTML = recoveryHTML(); return; }
  if (!S.profile) {
    app.innerHTML = loadingHTML();
    try { await loadProfile(); } catch (e) { if (token === S.rt) app.innerHTML = errorHTML(frErr(e.message)); return; }
    if (token !== S.rt) return;
  }
  if (!S.settingsLoaded) { await loadSettings(); if (token !== S.rt) return; }
  S.access = accessInfo(S.profile);
  if (S.access.reason === "phone") { app.innerHTML = phoneHTML(); return; }
  const parts = (location.hash || "#/home").split("/");
  let page = parts[1] || "home";
  if (!S.access.ok && !["abo", "profile"].includes(page)) { page = "abo"; history.replaceState(null, "", "#/abo"); }
  app.innerHTML = shell();
  if (page === "match") return pageMatch(token, Number(parts[2]) || 0);
  if (page === "matches") return pageMatches(token);
  if (page === "history") return pageHistory(token);
  if (page === "abo") return pageAbo(token);
  if (page === "profile") return pageProfile(token);
  if (page === "admin") return pageAdmin(token);
  return pageHome(token);
}
window.addEventListener("hashchange", route);

async function handleAuthHash() {
  const h = location.hash || "";
  if (!h.includes("access_token=") && !h.includes("error_description=")) return;
  const p = new URLSearchParams(h.replace(/^#\/?/, ""));
  history.replaceState(null, "", location.pathname);
  if (p.get("error_description")) { S.notice = "Ce lien n’est plus valide. Demande un nouveau lien."; return; }
  try {
    const at = p.get("access_token");
    const r = await fetch(SUPABASE_URL + "/auth/v1/user", { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + at } });
    const user = await r.json();
    setSession({ access_token: at, refresh_token: p.get("refresh_token"), expires_in: Number(p.get("expires_in") || 3600), user });
    if (p.get("type") === "recovery") S.recovery = true;
    else S.notice = "";
  } catch (e) { S.notice = "Impossible de valider ce lien. Connecte-toi avec ton e-mail."; }
}

(async function init() {
  if (configured()) {
    try { const raw = store.get("pf_session"); if (raw) S.session = JSON.parse(raw); } catch (e) {}
    await handleAuthHash();
    if (S.session && S.session.expires_at - Date.now() / 1000 < 120) await refreshSession();
    setInterval(() => { if (S.session && S.session.expires_at - Date.now() / 1000 < 180) refreshSession(); }, 60000);
    setInterval(() => { const h = location.hash || "#/home"; if (S.session && /^#\/(home|matches)?$/.test(h) && document.visibilityState === "visible") route(); }, 300000);
  }
  route();
})();
</script>
